name: Docker-Publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t bitcoin-satoshi-converter:test .
      - name: Smoke-test read-only, non-root container and SPA routing
        run: |
          docker run -d --name converter --read-only --user 1000:1000 \
            --security-opt no-new-privileges:true --pids-limit 10 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=1770 \
            -p 127.0.0.1:8080:8080 bitcoin-satoshi-converter:test
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/
          curl --fail --silent --show-error http://127.0.0.1:8080/settings
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404
      - name: Container logs and cleanup
        if: always()
        run: docker logs converter; docker rm -f converter
  docker:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bitcoin-satoshi-converter:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
